spring.application.name=api-management-service
server.port=8081

info.app.name=API Management Service
info.app.description=Management Service for users, routes and gateway policies

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/gatekeeper_management}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:9090}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true